name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (optional)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          working-directory: .
          # Specify a concrete version or remove to use latest
          buildozer_version: 1.5.1
          # Explicitly run buildozer command
          command: android debug

      - name: Find APK files
        run: find . -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FakeBank-Release-APK
          path: bin/

