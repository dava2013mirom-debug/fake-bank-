name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-setuptools \
            openjdk-17-jdk-headless \
            android-sdk \
            android-sdk-platform-tools \
            android-sdk-build-tools \
            cython3 \
            ccache \
            git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython setuptools

      - name: Build APK with Buildozer
        run: |
          cd ${{ github.workspace }}
          buildozer android debug 2>&1 | tee build_output.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log

      - name: Find APK files
        run: |
          echo "Searching for APK files..."
          find . -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FakeBank-Debug-APK
          path: bin/
          if-no-files-found: warn

      - name: Upload bin directory structure
        if: always()
        run: |
          echo "=== Directory structure ===" 
          ls -la bin/ 2>/dev/null || echo "bin/ directory not found"
          echo "=== Root directory ===" 
          ls -la . | head -20
